[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prack"
dynamic = ["version"]
description = "Paraglider tracker: Open Glider Network (OGN) live feed to SQL, with a minimal live map"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pillow>=10.0",  # decodes the terrain tiles
  "tzdata>=2024.1",  # time zone database; Windows has none built in
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
prack = "prack.cli:main"

[tool.setuptools.dynamic]
version = { attr = "prack.__version__" }

[tool.setuptools.packages.find]
include = ["prack*"]

[tool.setuptools.package-data]
prack = ["regions/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
